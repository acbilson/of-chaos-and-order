---
- name: Build static site artifact locally
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    local_podman_binary: podman
    local_site_image: docker.io/acbilson/of-chaos-and-order:latest
    local_build_root: "{{ playbook_dir }}/../.artifacts"
    local_site_build_dir: "{{ local_build_root }}/site"
    local_site_archive: "{{ local_build_root }}/of-chaos-and-order-site.tar.gz"
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Ensure local artifact directory exists
      ansible.builtin.file:
        path: "{{ local_build_root }}"
        state: directory
        mode: "0755"

    - name: Remove previous local site build directory
      ansible.builtin.file:
        path: "{{ local_site_build_dir }}"
        state: absent

    - name: Recreate local site build directory
      ansible.builtin.file:
        path: "{{ local_site_build_dir }}"
        state: directory
        mode: "0755"

    - name: Remove previous local site archive
      ansible.builtin.file:
        path: "{{ local_site_archive }}"
        state: absent

    - name: Build deployment image locally
      ansible.builtin.command:
        cmd: "{{ local_podman_binary }} build -f build/Dockerfile -t {{ local_site_image }} ."
        chdir: "{{ repo_root }}"

    - name: Render static site with deployment image
      ansible.builtin.command:
        cmd: >-
          {{ local_podman_binary }} run --rm
          -v {{ local_site_build_dir }}:/out
          {{ local_site_image }}
          hugo
          --source /app/site
          --config /etc/hugo/config.toml
          --destination /out
        chdir: "{{ repo_root }}"

    - name: Archive rendered site for upload
      ansible.builtin.archive:
        path: "{{ local_site_build_dir }}/"
        dest: "{{ local_site_archive }}"
        format: gz

- name: Publish static site and nginx config
  hosts: web
  become: true
  gather_facts: true

  vars:
    local_build_root: "{{ playbook_dir }}/../.artifacts"
    local_site_archive: "{{ local_build_root }}/of-chaos-and-order-site.tar.gz"
    remote_site_archive: /tmp/of-chaos-and-order-site.tar.gz

  handlers:
    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

  tasks:
    - name: Ensure site root exists
      ansible.builtin.file:
        path: "{{ app_site_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Upload rendered site archive
      ansible.builtin.copy:
        src: "{{ local_site_archive }}"
        dest: "{{ remote_site_archive }}"
        owner: root
        group: root
        mode: "0644"

    - name: Remove existing site root contents
      ansible.builtin.shell:
        cmd: "find {{ app_site_root | quote }} -mindepth 1 -maxdepth 1 -exec rm -rf {} +"
      changed_when: true

    - name: Unpack rendered site
      ansible.builtin.unarchive:
        src: "{{ remote_site_archive }}"
        dest: "{{ app_site_root }}"
        remote_src: true
        owner: root
        group: root

    - name: Install nginx site config
      ansible.builtin.template:
        src: ../templates/nginx-site.conf.j2
        dest: "{{ nginx_site_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: reload nginx

    - name: Enable nginx site config
      ansible.builtin.file:
        src: "{{ nginx_site_path }}"
        dest: "{{ nginx_site_enabled_path }}"
        state: link
      notify: reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Remove uploaded site archive
      ansible.builtin.file:
        path: "{{ remote_site_archive }}"
        state: absent
