{{ define "main" }}
  <section class="section-page">
    <header class="page-header">
      {{ with .Params.eyebrow }}<p class="page-header__eyebrow">{{ . }}</p>{{ end }}
      <h1>{{ .Title }}</h1>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
    <div class="card-grid">
      {{ range .Pages.ByDate.Reverse }}
        <article class="card">
          <p class="card__meta">
            {{ with .Params.subjects }}{{ delimit . ", " }}{{ end }}
          </p>
          <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
          <p>{{ .Summary }}</p>
        </article>
      {{ end }}
    </div>
  </section>
{{ end }}
